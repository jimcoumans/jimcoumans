# Netlify-instellingen voor de James Robinson Wallet.
#
# De Next.js-runtime van Netlify wordt automatisch bijgewerkt; we pinnen hem
# bewust niet, want dan lopen we achter op de Next-versie die we draaien.

[build]
  # Eerst de migraties, dan pas bouwen. Lukken de migraties niet, dan stopt de
  # bouw en gaat er niets live: de vorige versie blijft draaien met de
  # database die daarbij hoort. Zonder deze volgorde kan de code live gaan
  # terwijl de database achterblijft, en dan valt het halve systeem om tot
  # iemand met de hand SQL draait.
  command = "npm run db:migrate && npm run build"
  publish = ".next"

# Previews en branch-builds bouwen alleen, zonder migraties. Ze gebruiken
# dezelfde database als productie, en een migratie uit een branch die nog
# niet gemerged is, kwam zo al in productie terecht. Daarna liep de echte
# deploy vast op een tabel die er al stond (november 2026). Alleen wat in de
# productiebranch zit, mag de database veranderen.
#
# Gevolg: een preview van een branch met een nieuwe tabel kan op die pagina's
# een fout geven. Dat is de prijs; een productiedatabase met ongereviewde
# wijzigingen is erger.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# De dagelijkse abonnementsrun. Netlify draait deze functie volgens het
# schema hieronder; de functie roept vervolgens /api/cron/billing aan met
# het geheim. Zie netlify/functions/billing.mts.
[functions."billing"]
  schedule = "0 6 * * *"

# De dagelijkse opruimtaak: sollicitatiegegevens waarvan de bewaartermijn om
# is. Apart van het factureren en een uur eerder, want dit is een wettelijke
# termijn en die mag niet afhangen van of een factuurrun lukt.
[functions."opruimen"]
  schedule = "0 5 * * *"

# Elke nacht de performancecijfers per klant bijwerken (GA4, Search Console,
# Google Ads en Meta). Netlify rekent in UTC: 03:17 UTC is 04:17 Nederlandse
# wintertijd en 05:17 zomertijd. Op minuut 17 en niet op het hele uur, zodat
# het niet samenvalt met de andere runs.
[functions."performance"]
  schedule = "17 3 * * *"
