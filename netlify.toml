# Netlify-instellingen voor de James Robinson Wallet.
#
# De Next.js-runtime van Netlify wordt automatisch bijgewerkt; we pinnen hem
# bewust niet, want dan lopen we achter op de Next-versie die we draaien.

[build]
  # Eerst de migraties, dan pas bouwen. Lukken de migraties niet, dan stopt de
  # bouw en gaat er niets live: de vorige versie blijft draaien met de
  # database die daarbij hoort. Zonder deze volgorde kan de code live gaan
  # terwijl de database achterblijft, en dan valt het halve systeem om tot
  # iemand met de hand SQL draait.
  command = "npm run db:migrate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# De dagelijkse abonnementsrun. Netlify draait deze functie volgens het
# schema hieronder; de functie roept vervolgens /api/cron/billing aan met
# het geheim. Zie netlify/functions/billing.mts.
[functions."billing"]
  schedule = "0 6 * * *"

# De dagelijkse opruimtaak: sollicitatiegegevens waarvan de bewaartermijn om
# is. Apart van het factureren en een uur eerder, want dit is een wettelijke
# termijn en die mag niet afhangen van of een factuurrun lukt.
[functions."opruimen"]
  schedule = "0 5 * * *"
